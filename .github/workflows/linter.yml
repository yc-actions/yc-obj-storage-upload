# This workflow will lint the entire codebase using the
# `super-linter/super-linter` action.
#
# For more information, see the super-linter repository:
#     https://github.com/super-linter/super-linter
name: Lint Codebase

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read
    packages: read
    statuses: write

jobs:
    lint:
        name: Lint Codebase
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Install Dependencies
              id: install
              run: npm ci

            - name: Lint Codebase
              id: super-linter
              uses: super-linter/super-linter/slim@v8
              env:
                  DEFAULT_BRANCH: main
                  # dist/ is a generated bundle. docs/superpowers/ holds the design spec and
                  # implementation plan for the v5 rewrite — historical process artifacts,
                  # thousands of lines of embedded code samples, not shipped documentation.
                  FILTER_REGEX_EXCLUDE: (dist/.*|docs/superpowers/.*)
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  LINTER_RULES_PATH: .
                  VALIDATE_ALL_CODEBASE: true
                  VALIDATE_BIOME_FORMAT: false
                  VALIDATE_BIOME_LINT: false
                  # dotenv-linter rejects dashes in keys, but .env.example's keys are dictated
                  # by @actions/core: getInput('yc-sa-id') reads INPUT_YC-SA-ID. Renaming them
                  # would break `npm run local-action`, so this linter can never pass here.
                  VALIDATE_ENV: false
                  VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
                  VALIDATE_JAVASCRIPT_ES: false
                  VALIDATE_JSCPD: false
                  VALIDATE_JSON: false
                  VALIDATE_TYPESCRIPT_ES: false
